<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Layout</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

      .card-container {
        width: 100%;
        max-width: 500px;
        margin: auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border: 1px solid #e5e7eb;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      .top {
        width: 100%;
      }

      .top img {
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
        width: 100%;
        height: 300px;
        object-fit: cover;
      }

      .bottom {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 1rem;
      }

      .bottom-inside {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      h1 {
        font-size: 3rem;
        font-family: Arial, Arial, Helvetica, sans-serif;
        font-weight: bold;
      }
      p {
        font-size: 1.2rem;
        font-family: Poppins, sans-serif;
        line-height: 2;
        width: 90%;
      }
      .img-container {
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 200px;
        cursor: pointer;
        gap: 2rem;
      }
      .img-container img {
        width: 25%;
      }
      img {
        width: 100%;
        height: auto;
        transition: all 0.3s ease;
      }

      .btn {
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: #fff;
        padding: 0.8rem 1.6rem;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      }

      .img-container img:hover {
        transform: translateX(2px);
      }
    </style>
  </head>
  <body>
    <div class="card-container">
      <div class="top">
        <img src="/images/buildings.jpg" alt="buildings.jpg" />
      </div>

      <div class="bottom">
        <div class="middle">
          <h1>Modern Architecture</h1>
          <p>
            We create modern and sustainable architecture that blends creatively
            <br />
            with functionality
          </p>
        </div>

        <div class="bottom-inside">
          <div class="img-container">
            <img src="/images/learnmore.png" alt="Learn More" />
            <p>Learn More</p>
          </div>

          <button class="btn">Get Started</button>
        </div>
      </div>
    </div>
  </body>
</html>
