<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Layout</title>
  </head>
  <body>
    <style>
      .container {
        width: 100%;
        max-width: 1200px;
        margin-inline: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 2px solid black;
      }
      h1 {
        font-size: 5rem;
      }

      .img-container {
        width: 100%;
        max-width: 50%;
        border: 4px solid black;
      }

      img {
        width: 100%;
      }

      @media screen and (max-width: 768px) {
        .container {
          display: flex;
          flex-direction: column;
          justify-content: center;
          text-align: center;
        }
      }
    </style>

    <div class="container">
      <h1>Make Better Solutions</h1>
      <div class="img-container">
        <img src="/images/logo.png" alt="logo.png" />
      </div>
    </div>
  </body>
</html>
