<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .thumbnail {
        width: 300px;
        display: block;
      }

      .search-bar {
        font-size: 20px;
        margin-left: 12px;
        display: block;
      }

      .video-preview {
        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
      }
    </style>
    <title>Youtube Clone.com</title>
  </head>
  <body>
    <input class="search-bar" type="text" placeholder="Search" />

    <div class="video-preview">
      <img
        class="thumbnail"
        src="assets/thumbnail-1.webp"
        alt="thumbnail-1.webp"
      />

      <p>Talking Tech and <strong>AI with</strong> Google CEO Sundar Pichai.</p>
      <p class="video-author">Marques Brownlee</p>
      <p class="video-stats">3.4M views &#183; 6 months ago</p>
    </div>

    <div class="video-preview">
      <img
        class="thumbnail"
        src="assets/thumbnail-2.webp"
        alt="thumbnail-2.webp"
      />
      <p>Try Not To Laugh Challenge #9</p>
      <p class="video-author">Markiplier</p>
      <p class="video-stats">19M view &#183; 4 years ago</p>
    </div>
  </body>
</html>
