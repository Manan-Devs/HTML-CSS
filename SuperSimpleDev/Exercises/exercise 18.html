<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 18</title>
  </head>
  <body>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");

      .container {
        width: 35%;
        background-color: white;
        padding: 20px;
      }

      .first-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .img-info-container {
        display: flex;
        gap: 30px;
        align-items: center;
      }

      .img-container {
        width: 100px;
        height: 100px;
      }

      .cat-jpg {
        width: 100%;
        height: 100%;
        border-radius: 50px;
        object-fit: cover;
        object-position: center;
      }

      .info-container {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .name {
        font-size: 20px;
        font-weight: bold;
        font-family: "Roboto";
      }

      .info {
        font-size: 20px;
        font-family: "Roboto";
        line-height: 1.5;
        color: rgb(185, 185, 185);
      }

      button {
        padding: 14px 25px;
        border-radius: 6px;
        border: none;
        background-color: rgb(68, 164, 248);
        color: white;
        font-size: 25px;
        font-weight: bold;
        cursor: pointer;
        font-family: "Roboto";
      }
    </style>
    <div class="container">
      <div class="first-item">
        <div class="img-info-container">
          <div class="img-container">
            <img class="cat-jpg" src="assets/cat.jpg" alt="cat.jpg" />
          </div>

          <div class="info-container">
            <div class="name">oliver</div>
            <div class="info">
              the cat <br />
              Popular
            </div>
          </div>
        </div>
        <button>Follow</button>
      </div>
      <div></div>
      <div></div>
    </div>
  </body>
</html>
