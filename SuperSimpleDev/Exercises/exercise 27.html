<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 27</title>
  </head>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
    body {
      height: 4000px;
    }

    .close-button {
      padding: 4px 10px 4px 10px;
      border-radius: 30px;
      background-color: black;
      color: white;
      position: absolute;
      right: 10px;
      top: 10px;
      font-family: "Poppins", sans-serif;
      cursor: pointer;
    }

    .close-button-2 {
      padding: 5px 12px 5px 12px;
      border-radius: 25px;
      background-color: black;
      color: white;
      position: absolute;
      right: 300px;
      top: -10px;
      font-family: "Poppins", sans-serif;
      cursor: pointer;
    }

    .time {
      background-color: black;
      color: white;
      position: absolute;
      bottom: 8px;
      right: 5px;
      padding: 4px 6px 4px 6px;
      font-family: "Roboto", sans-serif;
      font-size: 12px;
      font-weight: 500;
      border-radius: 2px;
    }

    .container {
      position: relative;
      display: inline-block;
      height: 600px;
      width: 600px;
      background-color: lightgrey;
    }

    img {
      position: absolute;
    }
  </style>

  <body>
    <div class="container">
      <img src="assets/clothing.png" alt="clothing.png" />
    </div>

    <!-- 15 a  -->
    <div class="close-button">X</div>

    <!-- 15 b  -->

    <div
      style="
        height: 180px;
        width: 320px;
        position: fixed;
        right: 20px;
        bottom: 250px;
        background-color: rgba(0, 0, 0, 0.527);
      "
    >
      <!-- 15 c -->
      <div class="close-button-2">X</div>
    </div>

    <!-- 15 d -->
    <div
      style="
        height: 180px;
        width: 320px;
        position: fixed;
        right: 20px;
        bottom: 20px;
        background-color: rgba(0, 0, 0, 0.527);
      "
    >
      <div class="close-button-2">X</div>

      <div class="time">0:29</div>

      <!-- 15 e -->
    </div>
  </body>
</html>
