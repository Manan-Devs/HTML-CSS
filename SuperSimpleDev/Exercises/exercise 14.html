<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 14</title>
  </head>

  <style>
    .big-container {
      padding: 20px 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: grid;
      grid-template-columns: 300px 300px 300px;
      align-items: center;
      margin-top: 20px;
      max-width: 850px;
    }

    .container {
      display: grid;
      grid-template-rows: 1fr 1fr 1fr;
      width: 200px;
      height: 340px;
      border: 1px solid lightgray;
      padding: 20px 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .img-container {
      max-width: 300px;
      object-fit: cover;
      object-position: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    img {
      width: 100%;
      height: 200px;
    }

    h1 {
      margin: 0;
    }

    button {
      padding: 10px 20px;
      border-radius: 4px;
      border: none;
      background-color: rgb(0, 136, 255);
      color: white;
      font-size: large;
      cursor: pointer;
    }
  </style>
  <body>
    <div class="big-container">
      <div class="container">
        <div class="img-container">
          <img src="assets/cat.jpg" alt="cat.jpg" />
        </div>

        <h1>Oliver</h1>
        <p>2 mutual friends</p>

        <button>Add Friend</button>
      </div>

      <div class="container">
        <div class="img-container">
          <img src="assets/cat-2.jpg" alt="cat.jpg" />
        </div>

        <h1>Mimi</h1>
        <p>3 mutual friends</p>

        <button>Add Friend</button>
      </div>

      <div class="container">
        <div class="img-container">
          <img src="assets/dog.jpg" alt="cat.jpg" />
        </div>

        <h1>Rex</h1>
        <p>4 mutual friends</p>

        <button>Add Friend</button>
      </div>
    </div>
  </body>
</html>
