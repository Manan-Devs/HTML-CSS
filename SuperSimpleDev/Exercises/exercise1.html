<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 1</title>
  </head>
  <body>
    <img
      style="width: 250px; border-radius: 15px; object-fit: cover"
      src="assets/cat.jpg"
      alt="cat.jpg"
    />

    <img
      style="
        width: 400px;
        height: 400px;
        object-fit: cover;
        /* object-position: center; */
      "
      src="assets/cat.jpg"
      alt="cat.jpg"
    />

    <img
      style="
        width: 200px;
        height: 200px;
        border-radius: 100px;
        object-fit: cover;
        object-position: center;
      "
      src="assets/cat.jpg"
      alt="cat.jpg"
    />

    <input
      type="text"
      placeholder="Search"
      style="
        height: 20px;
        width: 220px;
        border-radius: 5px;
        border: 2px solid;
        padding: 15px;
        display: block;
        margin: 100px;
        font-size: 25px;
      "
    />
  </body>
</html>
