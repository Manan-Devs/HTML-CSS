<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 11</title>
  </head>

  <style>
    .img-container {
      text-align: center;
    }

    input {
      width: 500px;
      border-radius: 20px;
      border: 2px solid lightgray;
      font-size: 20px;
      padding: 10px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
    }

    .search-container {
      text-align: center;
    }

    .btns {
      text-align: center;
      margin-top: 40px;
    }

    .btn {
      font-size: 20px;
      padding: 10px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      cursor: pointer;
      border: none;
      margin-right: 25px;
    }
  </style>
  <body>
    <div class="img-container">
      <img src="assets/google.jpg" alt="google.jpg" />
    </div>
    <div class="search-container">
      <input type="text" placeholder="Search Google or type a URL" />
    </div>

    <div class="btns">
      <button class="btn">Google Search</button>
      <button class="btn">I'm Feeling Lucky</button>
    </div>
  </body>
</html>
