<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 9</title>
  </head>

  <style>
    .container {
      display: inline-block;
      width: 200px;
      height: 340px;
      border: 1px solid lightgray;
      padding: 20px 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .img-container {
      max-width: 300px;
      object-fit: cover;
      object-position: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    img {
      width: 100%;
      height: 200px;
    }

    h1 {
      margin: 0;
    }

    button {
      padding: 10px 20px;
      border-radius: 4px;
      border: none;
      background-color: rgb(0, 136, 255);
      color: white;
      font-size: large;
      cursor: pointer;
    }
  </style>
  <body>
    <div class="container">
      <div class="img-container">
        <img src="assets/cat.jpg" alt="cat.jpg" />
      </div>

      <h1>Oliver</h1>
      <p>2 mutual friends</p>

      <button>Add Friend</button>
    </div>
  </body>
</html>
