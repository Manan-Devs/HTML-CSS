<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 22</title>
  </head>
  <body>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 90vh;
      }

      .twitter-post-container {
        padding: 20px;
        background-color: white;
        width: 575px;
        box-shadow: 0px 5px 10px 0px rgba(0, 0, 0, 0.475);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        font-family: "Roboto";
      }

      .post-info-container {
        display: flex;
        gap: 30px;
      }

      .cat-jpg {
        width: 70px;
        height: 70px;
        border-radius: 60px;
        object-fit: cover;
        object-position: center;
      }

      .profile-name-info-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .profile-name {
        display: flex;
        gap: 15px;
        align-items: center;
        margin-top: -10px;
      }

      .post-content {
        margin-top: -20px;
      }

      .post-uploads-container {
        margin-top: 15px;
        padding-left: 90px;
        padding-bottom: 20px;
        padding-right: 0px;
        display: flex;
        gap: 25px;
      }

      .upload-content-container {
        width: 125px;
        height: 125px;
        background-color: lightgray;
        border-radius: 25px 0px 0px 25px;
      }
    </style>

    <div class="twitter-post-container">
      <div class="post-info-container">
        <div class="profile-img">
          <img class="cat-jpg" src="assets/cat.jpg" alt="cat.jpg" />
        </div>
        <div class="profile-name-info-container">
          <div class="profile-name">
            <p style="font-weight: bold">supersimple.dev</p>
            <p style="font-weight: bold; color: lightgray">@SuperSimpleDev</p>
          </div>

          <div class="post-content">
            <p>
              What is backend web development? A complete <br />
              overview. New video is up!
            </p>
          </div>
        </div>
      </div>
      <div class="post-uploads-container">
        <div class="upload-content-container"></div>
        <div class="uploads-info-container">
          <p style="color: lightgray">youtube.com</p>
          <p style="margin-top: 10px">
            Backend web development - a <br />
            complete overview (2021)
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
