<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 7</title>
  </head>
  <style>
    h1 {
      margin-bottom: 40px;
      font-family: "Arial, Helvetica, sans-serif";
    }
    .search-bar {
      padding: 15px;
      width: 345px;
      margin-bottom: 10px;
      border: none;
      border-radius: 3px;
      display: block;
      background-color: rgba(220, 220, 220, 0.992);
      font-size: 20px;
    }

    .btn-1 {
      margin-top: 30px;
      margin-right: 30px;
      padding: 15px;
      width: 165px;
      font-size: large;
      color: white;
      background-color: black;
      border: none;
      cursor: pointer;
    }

    .btn-2 {
      margin-top: 40px;
      padding: 19px;
      width: 180px;
      font-size: 16px;
      color: black;
      background-color: lightgray;
      border: none;
      cursor: pointer;
    }
  </style>
  <body>
    <h1>Request a Ride now</h1>

    <input class="search-bar" placeholder="Enter pickup location" type="text" />
    <input class="search-bar" placeholder="Enter destination" type="text" />

    <button class="btn-1">Request now</button>
    <button class="btn-2">Schedule for later</button>
  </body>
</html>
