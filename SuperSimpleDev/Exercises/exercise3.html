<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 3</title>
  </head>
  <body>
    <style>
      .container {
        width: 100%;
        margin: auto;
        max-width: 1200px;
        display: flex;
        gap: 110px;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .content {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .cat-jpg {
        width: 100px;
        height: 100px;
        border-radius: 50px;
        object-fit: cover;
        object-position: center;
      }

      h3 {
        font-family: "Arial, Helvetica, sans-serif";
        font-size: 20px;
      }

      .tweet {
        background-color: #075cccfd;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 25px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>

    <div class="container">
      <div class="content">
        <img class="cat-jpg" src="assets/cat.jpg" alt="cat.jpg" />
        <h3>What's happening?</h3>
      </div>
      <button class="tweet">Tweet</button>
    </div>
  </body>
</html>
